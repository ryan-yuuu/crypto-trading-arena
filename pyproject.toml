[project]
name = "crypto-daytrading-arena"
version = "0.1.0"
description = "Multi-agent crypto daytrading arena powered by Calfkit"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "calfkit>=0.12.6",
    "httpx>=0.27",
    "plotext>=5.3.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=14.0.0",
    "sympy>=1.13",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "testcontainers>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(levelname)-5s %(name)s — %(message)s"
log_cli_date_format = "%H:%M:%S"
markers = [
    "llm: test performs a live LLM inference call (needs an API key; excluded in CI via -m 'not llm')",
    "broker: test needs a live Kafka/Redpanda broker (opt-in via --run-broker; a container is spun up)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
# relative_files is required by python-coverage-comment-action: it reads the
# .coverage file inside its own container, where the runner's absolute paths
# don't resolve — only repo-relative paths work in both.
relative_files = true
# Scope the badge to the unit-tested core: the simulated-trading engine and config.
# The exchange connectors are live-venue WebSocket/REST I/O (exercised by the broker
# integration job, not the unit suite) and deploy/* are CLI entrypoints, so both are
# excluded so the badge reflects the code the unit suite actually covers.
source = ["arena", "config"]

[tool.coverage.report]
show_missing = true
omit = ["*/__init__.py"]
