name: CI

# Runs the non-live-LLM test suite on every PR and on pushes to main.
# Live LLM tests (marked `llm`) need an API key and are excluded here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .

  unit:
    name: Unit tests (py3.10)
    runs-on: ubuntu-latest
    # python-coverage-comment-action needs contents:write to commit the badge +
    # data to the python-coverage-comment-action-data branch on pushes to main,
    # and pull-requests:write to post the coverage comment on same-repo PRs.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Floor of requires-python (>=3.10); a green floor implies newer versions.
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run non-LLM, non-broker tests with coverage
        run: uv run pytest -m "not llm and not broker" --cov --cov-report=term-missing
      - name: Coverage comment & badge
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # Thresholds set the badge colour only; they do not gate CI.
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
      - name: Store coverage comment (fork / Dependabot PRs)
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  broker:
    name: Broker integration (Redpanda)
    runs-on: ubuntu-latest
    # Docker is preinstalled on GitHub-hosted ubuntu runners; testcontainers
    # starts Redpanda automatically. No external services block needed.
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run broker tests against Redpanda
        run: uv run pytest -m broker --run-broker
